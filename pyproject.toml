[project]
name = "fdp-arc"
version = "0.1.0"
description = "Analysis and visualization of Articulated Flexible Drillpipe simulation results"
readme = "README.md"
authors = [
    { name = "cospeng", email = "cospeng@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "scienceplots>=2.2.2",
    "seaborn>=0.13.2",
]

[project.scripts]
fdp-arc = "fdp_arc:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

